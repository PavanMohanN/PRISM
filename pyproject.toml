[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-flow"
version = "1.0.0"
description = "PRISM: Physically-constrained Reversible Inference via Stochastic liquid-ODE Maps for ill-posed inverse problems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pavan Mohan Neelamraju" }]
keywords = ["inverse-problems", "neural-ode", "normalizing-flows", "invertible-networks",
            "uncertainty-quantification", "operator-learning", "physics-informed"]

dependencies = [
    "torch>=2.0",
    "torchdiffeq>=0.2.3",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "emcee>=3.1",
]

[project.optional-dependencies]
sbi = ["sbibm"]            # optional: external reference posteriors
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
